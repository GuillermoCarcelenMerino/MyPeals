name: CI

on:
  pull_request:
    branches: [master] # PRs hacia master: al abrir, actualizar y reabrir

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, test and Kover
        run: ./gradlew assembleRelease lintRelease testDebugUnitTest koverVerifyDebug